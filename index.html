<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FutEscola</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Usamos o <main> com a sua classe .screen para manter o layout -->
    <main id="login" class="screen">
        
        <!-- O cabeçalho interno da área de login -->
        <header>
            <div class="logologin">
                <img src="images/Logo_do_TCC-P2.png" alt="Logo FutEscola">
            </div>

            <h1 style="text-align: center;">Login</h1>

            <p class="frase-login">
                <strong>Bem-vindo ao FutEscola</strong>
                Gerencie torneios, partidas e rankings de forma simples e organizada.
            </p>
        </header>

        <!-- O formulário de ação -->
        <form id="formLogin">
            <input name="email" type="email" placeholder="Email" required aria-label="E-mail">

            <input name="senha" type="password" placeholder="Senha" required aria-label="Senha">

            <div class="container-botoes" style="display: flex; justify-content: center;">
                <button type="submit" class="btn">ENTRAR</button>
            </div>

            <div id="erroLogin" style="color:red; text-align: center; margin-top:10px;"></div>
        </form>

        <!-- Rodapé do bloco de login para links auxiliares -->
        <footer>
            <p style="text-align:center; margin-top:15px;">
                <a href="../php/cadastro.php">Cadastrar-se</a>
            </p>
        </footer>

    </main>

    <script src="js/auth.js"></script>
</body>
</html>
